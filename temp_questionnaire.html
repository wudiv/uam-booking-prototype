<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>原型浏览完成 - 问卷交接</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#004e5c",
                        "on-tertiary-fixed": "#2d1600",
                        "primary-fixed": "#aaedff",
                        "on-secondary-fixed": "#001f23",
                        "secondary": "#006971",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#5cd7e5",
                        "inverse-on-surface": "#f3f0ef",
                        "surface-container-low": "#f6f3f2",
                        "secondary-fixed": "#88f3ff",
                        "on-primary-fixed": "#001f26",
                        "tertiary-fixed-dim": "#ffb874",
                        "on-secondary-fixed-variant": "#004f56",
                        "on-surface": "#1c1b1b",
                        "surface-container-high": "#eae7e7",
                        "primary": "#006071",
                        "on-tertiary-fixed-variant": "#6a3b00",
                        "on-surface-variant": "#3e484b",
                        "surface-bright": "#fcf9f8",
                        "surface": "#fcf9f8",
                        "outline-variant": "#bec8cc",
                        "background": "#fcf9f8",
                        "surface-container-highest": "#e5e2e1",
                        "on-background": "#1c1b1b",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffdcbf",
                        "inverse-primary": "#7ad3e9",
                        "on-error-container": "#93000a",
                        "tertiary": "#834a00",
                        "on-secondary-container": "#006d76",
                        "surface-variant": "#e5e2e1",
                        "surface-dim": "#dcd9d9",
                        "on-primary-container": "#e3f9ff",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#313030",
                        "outline": "#6e797c",
                        "secondary-container": "#79f1ff",
                        "primary-container": "#007b8f",
                        "on-error": "#ffffff",
                        "surface-tint": "#006879",
                        "tertiary-container": "#a55f00",
                        "surface-container": "#f0eded",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#fff3eb",
                        "primary-fixed-dim": "#7ad3e9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "stack-lg": "24px",
                        "stack-md": "16px",
                        "container-padding": "16px",
                        "gutter": "12px",
                        "stack-sm": "8px",
                        "safe": "env(safe-area-inset-bottom, 24px)"
                    },
                    "fontFamily": {
                        "label-lg": ["Hanken Grotesk"],
                        "label-sm": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "price-tag": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "price-tag": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-[884px] flex flex-col">
<!-- 
        Navigation Shell Suppressed.
        Reason: This is a linear/transactional handover screen (splash/success type intent) 
        where the user must focus entirely on the next task (the questionnaire). 
        TopAppBar and BottomNavBar are intentionally excluded to isolate the canvas.
    -->
<main class="flex-1 flex flex-col justify-center items-center px-container-padding max-w-md mx-auto w-full relative h-full pt-12 pb-safe">
<!-- Top flexible space to gently push content down, keeping it centered but visually grounded -->
<div class="flex-[0.8]"></div>
<!-- Content Cluster -->
<div class="w-full flex flex-col items-center text-center">
<!-- Minimal, quiet icon indicating completion of the previous step. No lock/shield motifs. -->
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-stack-md">
<span class="material-symbols-outlined text-3xl text-primary" style="font-variation-settings: 'FILL' 1;">
                    check
                </span>
</div>
<!-- Headline -->
<h1 class="text-display-lg font-display-lg text-on-surface tracking-tight mb-stack-sm">
                原型浏览完成
            </h1>
<!-- Explanatory Text -->
<p class="text-body-lg font-body-lg text-on-surface-variant max-w-[300px] mx-auto mb-stack-lg">
                请根据刚才的 UAM 预订流程，回答你对该服务的初始信任、风险感知和使用意向。
            </p>
<!-- Quiet Info Card (Bento/Glassmorphism inspired structure but grounded in Material 3 tones) -->
<div class="w-full max-w-[320px] bg-surface-container-lowest rounded-xl p-stack-lg shadow-[0_8px_24px_rgba(0,0,0,0.04)] border border-outline-variant/30 flex flex-col items-center justify-center relative overflow-hidden">
<!-- Subtle top accent line to anchor the card without being loud -->
<div class="absolute top-0 left-0 w-full h-[3px] bg-secondary-container opacity-50"></div>
<div class="flex flex-col gap-1 items-center">
<span class="text-headline-md font-headline-md text-on-surface">接下来将进入问卷</span>
<span class="text-body-md font-body-md text-outline">请按照你的真实感受作答</span>
</div>
</div>
</div>
<!-- Bottom flexible space -->
<div class="flex-[1.2]"></div>
<!-- Primary Action Button -->
<div class="w-full mt-auto pt-stack-md pb-4">
<button class="w-full h-[48px] bg-primary hover:bg-primary/90 text-on-primary text-label-lg font-label-lg rounded-lg flex items-center justify-center transition-colors shadow-sm active:scale-[0.98] duration-150 group">
                开始填写问卷
                <span class="material-symbols-outlined ml-2 text-xl opacity-80 group-hover:translate-x-1 transition-transform">
                    arrow_forward
                </span>
</button>
</div>
</main>
</body></html>
