<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 移动端视口自适应 + 安全区域支持 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA 相关：状态栏样式 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#FCF9F8" />
    <title>UAM 预订原型</title>
    <script>
        // 动态生成 manifest，确保 start_url 包含当前路径（实验组信息）
        (function() {
            var path = window.location.pathname;
            var search = window.location.search;
            var startUrl = path + search || '/';
            // 同时从路径或参数中提取 group 并存入 localStorage
            var match = path.match(/\/g\/(\d+)/);
            var params = new URLSearchParams(search);
            var group = match ? match[1] : params.get('group');
            if (group && /^[0-8]$/.test(group)) {
                localStorage.setItem('uam-experiment-group', String(parseInt(group, 10) - (match ? 1 : 0)));
            }
            var manifest = {
                name: 'UAM 预订原型',
                short_name: 'UAM',
                start_url: startUrl,
                scope: '/',
                display: 'standalone',
                orientation: 'portrait',
                background_color: '#ffffff',
                theme_color: '#ffffff',
                icons: [{
                    src: '/favicon.svg',
                    sizes: 'any',
                    type: 'image/svg+xml'
                }]
            };
            var blob = new Blob([JSON.stringify(manifest)], {
                type: 'application/json'
            });
            var url = URL.createObjectURL(blob);
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = url;
            document.head.appendChild(link);

            // Fullscreen API：首次用户交互时请求全屏（Android Chrome 支持）
            var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            if (!isStandalone) {
                var requestFullscreen = function() {
                    var el = document.documentElement;
                    var rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
                    if (rfs) {
                        rfs.call(el).catch(function() {});
                    }
                    document.removeEventListener('click', requestFullscreen);
                    document.removeEventListener('touchstart', requestFullscreen);
                };
                document.addEventListener('click', requestFullscreen, {
                    once: true
                });
                document.addEventListener('touchstart', requestFullscreen, {
                    once: true
                });
            }
        })();
    </script>
    <script type="text/javascript">
        window._AMapSecurityConfig = {
            securityJsCode: "e90d4ca05da60ad205182180f82c2cdc",
        }
    </script>
    <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=2cd8626ad2802116de44b2ec0a4e6f4f"></script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
